# ===================================================================
# CONFIGURACIÓN DE INVERSIÓN LIBRE - BACKEND API
# ===================================================================

# Application Info
spring.application.name=inversion-libre-backend
server.port=8080

# ===================================================================
# MONGODB CONFIGURATION
# ===================================================================
# Temporalmente deshabilitado para desarrollo sin MongoDB
#spring.data.mongodb.uri=mongodb://localhost:27017/inversion_libre_db
#spring.data.mongodb.auto-index-creation=true

# MongoDB Connection Pool
#spring.data.mongodb.options.max-connection-per-host=50
#spring.data.mongodb.options.max-connection-idle-time=30000
#spring.data.mongodb.options.max-wait-time=10000

# Configuración temporal para desarrollo sin MongoDB
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# ===================================================================
# ACTUATOR CONFIGURATION
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always

# ===================================================================
# SECURITY & JWT CONFIGURATION
# ===================================================================
jwt.secret=Mi_Super_Secreto_JWT_Para_TFG_Inversion_Libre_2024_1234567890
jwt.expiration=86400000
# 24 horas en millisegundos

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.com.inversionlibre=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %level - %msg%n

# ===================================================================
# DEVELOPMENT CONFIGURATION
# ===================================================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Jackson Configuration
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/Madrid

# ===================================================================
# EXTERNAL APIs CONFIGURATION
# ===================================================================
# Para APIs de datos financieros (Alpha Vantage, Yahoo Finance, etc.)
api.financial.timeout=10000
api.financial.retry-attempts=3

# Cache Configuration
spring.cache.cache-names=stocks,portfolios,users
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m

# ===================================================================
# SPRINGDOC OPENAPI 3 (SWAGGER) CONFIGURATION
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.inversionlibre.backend.controller
springdoc.show-actuator=false

# Info para la documentación de la API
springdoc.info.title=Inversión Libre API
springdoc.info.description=API REST para la plataforma educativa financiera Inversión Libre - TFG
springdoc.info.version=1.0.0
springdoc.info.contact.name=Francisco Palero
springdoc.info.contact.email=francisco.palero@estudiante.uam.es
